- name: Connect VPN
  shell: bash
  run: |
    set -euo pipefail
    sudo apt-get update
    sudo apt-get install -y wireguard-tools
    sudo install -m 600 /dev/null /etc/wireguard/wg-deploy.conf

    sudo tee /etc/wireguard/wg-deploy.conf >/dev/null <<EOF
    [Interface]
    Address = ${{ secrets.WG_ADDRESS }}
    PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
    [Peer]
    PublicKey = ${{ secrets.WG_SERVER_PUBLIC_KEY }}
    Endpoint = ${{ secrets.WG_ENDPOINT }}
    AllowedIPs = ${{ secrets.WG_ALLOWED_IPS }}
    PersistentKeepalive = 25
    EOF

    sudo wg-quick up wg-deploy
    sudo wg show wg-deploy
